<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPIs · Grupo Educación · The Waldorf Agency</title>
<style>
  :root{
    --ink:#171717;
    --graphite:#6b6b6b;
    --muted:#9a9a9a;
    --page:#f6f6f4;
    --card:#ffffff;
    --line:#ebebe7;
    --track:#e8e8e4;
    --accent:#15805c;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-font-smoothing:antialiased}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
    padding:clamp(20px,5vw,64px) clamp(18px,5vw,64px);
  }
  .wrap{max-width:860px;margin:0 auto}

  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:clamp(30px,6vw,44px);font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:12px 0 0}

  .month{
    display:flex;align-items:center;gap:12px;
    margin:22px 0 34px;padding:14px 18px;
    background:var(--card);border:1px solid var(--line);border-radius:14px;width:fit-content;
  }
  .month .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .month .lab{font-size:13px;color:var(--muted);font-weight:500}
  .month .val{font-size:16px;font-weight:600;letter-spacing:-.01em}

  .overview{display:flex;gap:14px;margin:0 0 22px;flex-wrap:wrap}
  .ov{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
  .ov .n{font-size:38px;font-weight:600;letter-spacing:-.03em;line-height:1}
  .ov .n small{font-size:16px;color:var(--muted);font-weight:500;margin-left:2px}
  .ov .l{font-size:13px;color:var(--graphite);margin-top:8px}

  .list{display:flex;flex-direction:column;gap:12px}
  .kpi{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 26px;
    display:grid;grid-template-columns:1fr 250px;gap:22px 44px;align-items:center;transition:border-color .2s ease;
  }
  .kpi:hover{border-color:#d9d9d3}
  .kpi .name{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
  .kpi .meta{font-size:14px;color:var(--graphite);margin-top:6px}
  .kpi .base{font-size:12.5px;color:var(--muted);margin-top:3px}

  .prog{width:100%}
  .prog-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;gap:10px}
  .pct{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .pct.done{color:var(--accent)}
  .pct.empty{font-size:15px;color:var(--muted);font-weight:500}
  .cap{font-size:12px;color:var(--muted);text-align:right}
  .track{height:9px;background:var(--track);border-radius:999px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width 1.1s cubic-bezier(.16,1,.3,1)}
  .track.empty{background:repeating-linear-gradient(90deg,#dcdcd7 0 5px,transparent 5px 10px)}

  /* Leads Red Aprende */
  .leads{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px}
  .leads-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:18px}
  .leads-title{font-size:18px;font-weight:600;letter-spacing:-.01em}
  .leads-sub{font-size:13px;color:var(--muted);margin-top:4px}
  .colegios{display:flex;flex-direction:column;gap:8px}
  .col-item{border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
  .col-item.open{border-color:#d5d5cf}
  .col-row{width:100%;display:flex;align-items:center;gap:16px;padding:15px 16px;background:none;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .col-row:hover{background:#fafaf8}
  .col-name{font-size:15px;font-weight:600;flex:1;min-width:0}
  .col-stats{font-size:13px;color:var(--graphite);white-space:nowrap}
  .col-stats b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
  .chev{width:22px;height:22px;flex-shrink:0;display:grid;place-items:center;color:var(--muted);font-size:20px;line-height:1;transition:transform .22s ease}
  .col-item.open .chev{transform:rotate(45deg);color:var(--accent)}
  .col-detail{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .col-detail-inner{padding:2px 16px 16px}
  .metric-table{width:100%;border-collapse:collapse;font-size:13.5px}
  .metric-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line)}
  .metric-table th:first-child{text-align:left}
  .metric-table td{padding:9px 10px;border-bottom:1px solid #f2f2ee;text-align:right;font-variant-numeric:tabular-nums}
  .metric-table td:first-child{text-align:left;color:var(--graphite)}
  .metric-table tr:last-child td{border-bottom:0;font-weight:600}
  .col-stats .none{color:var(--muted);font-weight:500}

  @media (max-width:600px){
    .kpi{grid-template-columns:1fr;gap:18px}
    .col-stats{font-size:12px;white-space:normal}
  }
  @media (prefers-reduced-motion:reduce){
    .fill,.col-detail,.chev{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">The Waldorf Agency</div>
    <h1>KPIs · Grupo Educación</h1>
  </header>

  <div class="month">
    <span class="dot"></span>
    <span class="lab">Mes en curso</span>
    <span class="val" id="nowLabel">—</span>
  </div>

  <section class="overview">
    <div class="ov">
      <div class="n" id="ovAvg">—<small>%</small></div>
      <div class="l">Avance promedio hacia la meta</div>
    </div>
    <div class="ov">
      <div class="n" id="ovCount">10</div>
      <div class="l">Indicadores en seguimiento</div>
    </div>
  </section>

  <main class="list" id="list"></main>

</div>

<script>
/* ============================================================
   DATOS DEL TABLERO
   avance: número de 0 a 100, o null si no hay dato.
   actual: nota junto al porcentaje.  estado: texto cuando avance es null.
   ============================================================ */
const DATA = {
  mesActual: "2026-08",
  kpis: [
    { nombre:"Notas editoriales", meta:"4 notas mensuales, 48 al año", baseline:"1 nota por vertical", avance:25, actual:"12 de 48" },
    { nombre:"Presencia en medios", meta:"8 medios nacionales al año", baseline:"Gestión de comunicados", avance:0, actual:"0 de 8" },
    { nombre:"Crecimiento de seguidores", meta:"+10% global vs. periodo anterior", baseline:"69,887 seguidores", avance:18, actual:"71,140 de 76,876" },
    { nombre:"Alcance de publicaciones", meta:"+10% de alcance global", baseline:"Alcance del periodo anterior", avance:11, actual:"" },
    { nombre:"Recaudación Fundaju vía sitio web", meta:"+10% de recaudación online", baseline:"$28,773", avance:0, actual:"sin registro aún" },
    { nombre:"Calidad de lead", meta:"Bajar a 24.7% de leads no calificados", baseline:"29% de leads no calificados", avance:null, estado:"Dato por actualizar" },
    { nombre:"Costo por lead", meta:"-5% en costo por lead", baseline:"$494 (en validación)", avance:null, estado:"Dato por actualizar" },
    { nombre:"Desarrollo y ampliación de sitios web", meta:"6 sitios o ampliaciones al año", baseline:"Infraestructura digital del Grupo", avance:33, actual:"2 de 6" },
    { nombre:"Mantenimiento web", meta:"100% de sitios operativos al cierre de mes", baseline:"2 revisiones por sitio al mes", avance:100, actual:"100% operativos" },
    { nombre:"Newsletter", meta:"+5% en tasa de apertura (de 27% a 32%)", baseline:"27% de apertura", avance:2, actual:"creció 0.11% de 5%" }
  ]
};

/* ============================================================
   LEADS · RED APRENDE  (pauta digital por colegio, Meta y Google)
   Valores tomados del Excel de julio, sin alterar.
   ============================================================ */
const LEADS = {
  periodo: "Julio 2026",
  colegios: [
    { nombre:"Instituto Anglo Moderno", gasto:"$20,613.42", clics:"17,873",
      metricas:[
        {m:"Alcance",meta:"130,688",google:"N/A"},
        {m:"Impresiones",meta:"449,297",google:"143,281"},
        {m:"Clics",meta:"7,171",google:"10,702"},
        {m:"CPM",meta:"$45.08",google:"$35.84"},
        {m:"CPC",meta:"$3.60",google:"$0.48"},
        {m:"CTR",meta:"1.25%",google:"7.47%"},
        {m:"Gasto total",meta:"$15,477.55",google:"$5,135.87"}
      ]},
    { nombre:"Colegio Alerce", gasto:"$56,274.11", clics:"13,442",
      metricas:[
        {m:"Alcance",meta:"244,511",google:"N/A"},
        {m:"Impresiones",meta:"1,004,026",google:"217,543"},
        {m:"Clics",meta:"10,894",google:"2,548"},
        {m:"CPM",meta:"$44.87",google:"$51.57"},
        {m:"CPC",meta:"$4.14",google:"$4.40"},
        {m:"CTR",meta:"1.09%",google:"1.17%"},
        {m:"Gasto total",meta:"$45,054.57",google:"$11,219.54"}
      ]},
    { nombre:"Colegio Americano de San Carlos", gasto:"$10,305.37", clics:"7,587",
      metricas:[
        {m:"Alcance",meta:"10,801",google:"N/A"},
        {m:"Impresiones",meta:"24,675",google:"95,766"},
        {m:"Clics",meta:"284",google:"7,303"},
        {m:"CPM",meta:"$28.22",google:"$338.89"},
        {m:"CPC",meta:"$2.45",google:"$1.32"},
        {m:"CTR",meta:"1.15%",google:"7.63%"},
        {m:"Gasto total",meta:"$696.32",google:"$9,609.05"}
      ]},
    { nombre:"Colegio Albertson's", gasto:"$30,858.93", clics:"8,580", nota:"Sin campaña en Google en julio",
      metricas:[
        {m:"Alcance",meta:"119,366",google:"N/A"},
        {m:"Impresiones",meta:"684,593",google:"0"},
        {m:"Clics",meta:"8,580",google:"0"},
        {m:"CPM",meta:"$45.08",google:"$0.00"},
        {m:"CPC",meta:"$3.60",google:"$0.00"},
        {m:"CTR",meta:"1.25%",google:"0%"},
        {m:"Gasto total",meta:"$30,858.93",google:"$0.00"}
      ]}
  ]
};

const ML = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

(function(){
  const [y,m]=DATA.mesActual.split("-").map(Number);
  document.getElementById("nowLabel").textContent=`${ML[m-1]} ${y}`;
})();

function buildLeads(){
  const sec=document.createElement("section");
  sec.className="leads";
  const cols=LEADS.colegios.map(c=>{
    const rows=c.metricas.map(r=>`<tr><td>${r.m}</td><td>${r.meta}</td><td>${r.google}</td></tr>`).join("");
    const nota=c.nota?`<div style="font-size:12px;color:var(--muted);margin-top:8px">${c.nota}</div>`:"";
    return `<div class="col-item">
      <button class="col-row" type="button" aria-expanded="false">
        <span class="col-name">${c.nombre}</span>
        <span class="col-stats"><b>${c.gasto}</b> gasto · <b>${c.clics}</b> clics</span>
        <span class="chev">+</span>
      </button>
      <div class="col-detail">
        <div class="col-detail-inner">
          <table class="metric-table">
            <thead><tr><th>Métrica</th><th>Meta</th><th>Google</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
          ${nota}
        </div>
      </div>
    </div>`;
  }).join("");

  sec.innerHTML=`
    <div class="leads-head">
      <div>
        <div class="leads-title">Leads · Red Aprende</div>
        <div class="leads-sub">Pauta digital · ${LEADS.periodo} · Meta y Google</div>
      </div>
    </div>
    <div class="colegios">${cols}</div>`;

  sec.querySelectorAll(".col-row").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const item=btn.closest(".col-item");
      const det=item.querySelector(".col-detail");
      const open=item.classList.toggle("open");
      btn.setAttribute("aria-expanded",open?"true":"false");
      det.style.maxHeight=open?det.scrollHeight+"px":"0";
    });
  });
  return sec;
}

(function(){
  const list=document.getElementById("list");
  DATA.kpis.forEach(k=>{
    const has=typeof k.avance==="number";
    const pct=has?Math.max(0,Math.min(100,k.avance)):0;
    const done=has&&pct>=100;
    const label=has?pct+"%":(k.estado||"Por capturar");
    const el=document.createElement("article");
    el.className="kpi";
    el.innerHTML=`
      <div class="info">
        <div class="name">${k.nombre}</div>
        <div class="meta">Meta: ${k.meta}</div>
        <div class="base">Base 2025: ${k.baseline}</div>
      </div>
      <div class="prog">
        <div class="prog-top">
          <span class="pct ${done?"done":""} ${has?"":"empty"}">${label}</span>
          <span class="cap">${has?(k.actual||"hacia la meta"):""}</span>
        </div>
        <div class="track ${has?"":"empty"}"><div class="fill" data-pct="${pct}"></div></div>
      </div>`;
    list.appendChild(el);
    if(/^Costo por lead/.test(k.nombre)) list.appendChild(buildLeads());
  });

  const nums=DATA.kpis.map(k=>k.avance).filter(v=>typeof v==="number");
  if(nums.length){
    const avg=Math.round(nums.reduce((a,b)=>a+b,0)/nums.length);
    document.getElementById("ovAvg").innerHTML=`${avg}<small>%</small>`;
  }
  document.getElementById("ovCount").textContent=DATA.kpis.length;

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll(".track:not(.empty) .fill").forEach(f=>{f.style.width=f.dataset.pct+"%";});
  }));
})();
</script>
</body>
</html>
